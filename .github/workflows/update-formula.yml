name: Update formula

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update formula from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-formula
      - name: Commit an updated formula
        shell: bash
        run: |
          if [[ -z "$(git status --short -- Formula/embrasure.rb)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/embrasure.rb
          git commit -m "Update Embrasure formula"
          git push
